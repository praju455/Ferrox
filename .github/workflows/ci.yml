name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -m "not postgres and not live_llm"

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ferrox_test
          POSTGRES_USER: ferrox
          POSTGRES_PASSWORD: ferrox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferrox -d ferrox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ferrox:ferrox@localhost:5432/ferrox_test
      POSTGRES_TEST_URL: postgresql+psycopg://ferrox:ferrox@localhost:5432/ferrox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m alembic upgrade head
      - run: python -m pytest -m postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ferrox-api:test
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: ferrox-frontend:test
