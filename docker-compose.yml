services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ferrox
      POSTGRES_USER: ferrox
      POSTGRES_PASSWORD: ferrox
    ports:
      - "5432:5432"
    volumes:
      - ferrox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrox -d ferrox"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ferrox
      MINIO_ROOT_PASSWORD: change-this-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ferrox-minio:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 ferrox change-this-local-secret; do sleep 1; done &&
      mc mb --ignore-existing local/ferrox-sources &&
      mc anonymous set none local/ferrox-sources"

volumes:
  ferrox-postgres:
  ferrox-minio:
