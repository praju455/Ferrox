services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ferrox
      POSTGRES_USER: ferrox
      POSTGRES_PASSWORD: ferrox
    ports:
      - "5432:5432"
    volumes:
      - ferrox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrox -d ferrox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ferrox-postgres:
